{% extends 'core/base.html' %}
{% block content %}
<h1>Online Clipboard</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-group">
        <label for="content_type">Type</label>
        <select name="content_type" id="content_type" required onchange="toggleFields()">
            <option value="text">Text</option>
            <option value="file">File</option>
        </select>
    </div>
    <div id="text_field" class="form-group">
        <label for="text_content">Paste Text</label>
        <textarea name="text_content" id="text_content" rows="6" placeholder="Paste your text here..."></textarea>
    </div>
    <div id="file_field" class="form-group" style="display:none;">
        <label for="file_content">Upload File</label>
        <input type="file" name="file_content" id="file_content">
    </div>
    <div class="form-group">
        <label for="expiry_select">Expires In</label>
        <select name="expiry_select" id="expiry_select" onchange="setExpiry()">
            <option value="">No expiry</option>
            <option value="1h">1 hour</option>
            <option value="24h">24 hours</option>
            <option value="7d">7 days</option>
            <option value="1m">1 month</option>
            <option value="custom">Custom</option>
        </select>
    </div>
    <div class="form-group" id="expiry_custom_group" style="display:none;">
        <input type="datetime-local" name="expires_at" id="expires_at">
    </div>
    <button type="submit">Create Paste</button>
</form>
<p><a href="{% url 'retrieve' %}">Have a code? Retrieve a paste</a></p>
<script>
function toggleFields() {
    var type = document.getElementById('content_type').value;
    document.getElementById('text_field').style.display = (type === 'text') ? '' : 'none';
    document.getElementById('file_field').style.display = (type === 'file') ? '' : 'none';
}
function setExpiry() {
    var select = document.getElementById('expiry_select');
    var expiresInput = document.getElementById('expires_at');
    var customGroup = document.getElementById('expiry_custom_group');
    if (select.value === 'custom') {
        customGroup.style.display = '';
        expiresInput.required = true;
        expiresInput.value = '';
    } else if (select.value === '') {
        customGroup.style.display = 'none';
        expiresInput.required = false;
        expiresInput.value = '';
    } else {
        customGroup.style.display = 'none';
        expiresInput.required = false;
        // Set value to calculated expiry
        var now = new Date();
        if (select.value === '1h') now.setHours(now.getHours() + 1);
        if (select.value === '24h') now.setHours(now.getHours() + 24);
        if (select.value === '7d') now.setDate(now.getDate() + 7);
        if (select.value === '1m') now.setMonth(now.getMonth() + 1);
        expiresInput.value = now.toISOString().slice(0,16);
    }
}
document.getElementById('content_type').addEventListener('change', toggleFields);
document.getElementById('expiry_select').addEventListener('change', setExpiry);
window.onload = function() { toggleFields(); setExpiry(); };
</script>
{% endblock %}
